name: veracode-build-autopackage

on:
  push:
    branches:
      - feature/*
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: windows-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Install Veracode CLI
        shell: bash
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
 
      - name: Set Veracode credentials
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "VERACODE_API_KEY_ID=${{ secrets.VERACODE_API_ID }}"
          Add-Content $env:GITHUB_ENV "VERACODE_API_KEY_SECRET=${{ secrets.VERACODE_API_KEY }}"
 
      - name: Veracode Auto-Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
 
          $outputDir = "veracode-output"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
 
          & .\veracode package `
            --source "." `
            --output $outputDir `
            --trust `
            --verbose
 
          Write-Host "Generando el artefacto:"
          Get-ChildItem $outputDir | Format-Table Name, Length
 
          Write-Host "Seleccion del mejor artefacto para el escaneo de Veracode..."
 
          $artifact = Get-ChildItem $outputDir -Filter "*.zip" |
            Where-Object { $_.Name -notmatch "js|sql" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
 
          if (-not $artifact) {
            Write-Error "No artifact found"
            exit 1
          }
 
          Write-Host "✅ Selected artifact: $($artifact.FullName)"
 
          # Limpieza + estandarización
          Get-ChildItem $outputDir -Filter "*.zip" |
            Where-Object { $_.FullName -ne $artifact.FullName } |
            Remove-Item -Force
 
          Rename-Item $artifact.FullName "$outputDir/app.zip"
 
          Write-Host "Artifact listo para Veracode:"
          Get-ChildItem $outputDir | Format-Table Name, Length
 
      - name: Upload package for Veracode
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifact
          path: veracode-output/*.zip

  build-docker-image:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'feature/')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/verademo-net:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/verademo-net:${{ github.sha }}

      - name: List images
        run: docker images

  veracode-pipeline-scan:
    needs: build
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/veracode-pipeline-scan.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      issues: write
      security-events: write
    with:
      veracode_policy_name: 'Veracode Recommended Very High + SCA'
      json_output: true
      output_file: veracode-results.json
      fail_build: false
      verbose: true

  veracode-sandbox-feature:
    needs: build
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/veracode-sand-box.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      issues: write
      security-events: write
    with:
      veracode_app_profile_name: 'verademo-net'
      veracode_sandbox_name: 'feature-sandbox'
      create_profile: true
      create_sandbox: true
      scan_timeout: 0

  veracode-iac-scan:
    needs: build
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/veracode-iac-scan.yml
    secrets: inherit
    with:
      scan_type: directory
      scan_source: .
      format_result: json

  veracode-iac-scan_image:
    needs: build-docker-image
    if: |
      github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'feature/')
    uses: ./.github/workflows/veracode-iac-scan.yml
    secrets: inherit
    with:
      scan_type: image
      scan_source: ghcr.io/${{ github.repository }}/verademo-net:${{ github.sha }}
      format_result: json

  veracode-sandbox-develop:
    needs: build
    if: |
      github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'feature/')
    uses: ./.github/workflows/veracode-sand-box.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      issues: write
      security-events: write
    with:
      veracode_app_profile_name: 'verademo-net'
      veracode_sandbox_name: 'feature-develop-sandbox'
      create_profile: true
      create_sandbox: true

  veracode-policy-scan:
    needs: build
    if: |
      github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'
    uses: ./.github/workflows/veracode-policy-scan.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      issues: write
      security-events: write
    with:
      veracode_app_profile_name: 'verademo-net'