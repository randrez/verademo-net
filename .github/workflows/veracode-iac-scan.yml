name: Veracode IaC / Container Scan

on:
  workflow_call:
    inputs:
      scan_type:
        required: true
        type: string
      scan_source:
        required: true
        type: string
      format_result:
        required: false
        type: string
        default: json
      fail_build:
        required: false
        type: boolean
        default: true

jobs:
  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare scan source
        run: |
          if [ "${{ inputs.scan_type }}" = "image" ]; then
            echo "Using image: ${{ inputs.scan_source }}"
          else
            echo "Using directory: ${{ inputs.scan_source }}"
          fi

      - name: Install and Run Veracode CLI
        env:
          VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_KEY }}
        run: |
          echo "=== DEBUG: Current directory and environment ==="
          echo "PWD: $PWD"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          pwd
          ls -la
          echo "=== END DEBUG ==="
          
          # Set environment variables for Veracode CLI
          export VERACODE_API_KEY_ID="$VERACODE_API_KEY_ID"
          export VERACODE_API_KEY_SECRET="$VERACODE_API_KEY_SECRET"
          
          # Install Veracode CLI directly (downloads and runs in one step)
          # The CLI will be installed to the current directory
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          
          # Debug: Check where veracode binary was installed
          echo "=== Veracode CLI location ==="
          find . -name "veracode*" -type f -executable 2>/dev/null || find . -name "veracode*" -type f 2>/dev/null
          echo "=== End Veracode CLI location ==="
          
          # Find the veracode binary location
          VERACODE_CLI=$(find . -name "veracode" -type f -executable 2>/dev/null | head -n 1)
          if [ -z "$VERACODE_CLI" ]; then
            VERACODE_CLI=$(find . -name "veracode" -type f 2>/dev/null | head -n 1)
          fi
          
          if [ -n "$VERACODE_CLI" ]; then
            echo "Found veracode binary at: $VERACODE_CLI"
            ls -la "$VERACODE_CLI"
            
            # Configure Veracode CLI with API credentials
            echo "=== Configuring Veracode CLI with credentials ==="
            "$VERACODE_CLI" configure --vid "$VERACODE_API_KEY_ID" --vkey "$VERACODE_API_KEY_SECRET"
            
            # Run the scan using the found binary
            echo "=== Running Veracode scan ==="
            "$VERACODE_CLI" scan \
              --source ${{ inputs.scan_source }} \
              --type ${{ inputs.scan_type }} \
              --format ${{ inputs.format_result }} \
              --output results.txt
          else
            echo "ERROR: veracode binary not found"
            exit 1
          fi

      - name: Rename scan results to safe artifact names
        run: |
          for f in results.* sbom_*; do
            if [ -f "$f" ]; then
              # Reemplaza espacios o caracteres especiales
              safe_name=$(echo "$f" | tr '[:upper:] ' '[:lower:]_' | tr -cd '[:alnum:]_.')
              mv "$f" "veracode_iac_${safe_name}"
            fi
          done

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: veracode-iac-scan-results
          path: veracode_iac_*
