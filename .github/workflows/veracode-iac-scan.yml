name: Veracode IaC / Container Scan

on:
  workflow_call:
    inputs:
      scan_type:
        required: true
        type: string
      scan_source:
        required: true
        type: string
      format_result:
        required: false
        type: string
        default: json
      fail_build:
        required: false
        type: boolean
        default: true

jobs:
  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare scan source
        run: |
          if [ "${{ inputs.scan_type }}" = "image" ]; then
            echo "Using image: ${{ inputs.scan_source }}"
          else
            echo "Using directory: ${{ inputs.scan_source }}"
          fi

      - name: Run Veracode scan
        uses: veracode/container_iac_secrets_scanning@v1.0.1
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          command: scan
          type: ${{ inputs.scan_type }}
          source: ${{ inputs.scan_source }}
          format: ${{ inputs.format_result }}
          debug: true
          fail_build: ${{ inputs.fail_build }}
        env:
          DISABLE_ARTIFACT: true

      - name: Rename scan results to safe artifact names
        run: |
          # Renombrar todos los resultados de Veracode a nombres seguros para GitHub
          for f in results.* sbom_*; do
            if [ -f "$f" ]; then
              mv "$f" "veracode_iac_${f}"
            fi
          done

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: veracode-iac-scan-results
          path: veracode_iac_*