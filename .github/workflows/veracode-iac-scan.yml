name: Veracode IaC / Container Scan

on:
  workflow_call:
    inputs:
      scan_type:
        required: true
        type: string
      scan_source:
        required: true
        type: string
      format_result:
        required: false
        type: string
        default: json
      fail_build:
        required: false
        type: boolean
        default: true

jobs:
  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare scan source
        run: |
          if [ "${{ inputs.scan_type }}" = "image" ]; then
            echo "Using image: ${{ inputs.scan_source }}"
          else
            echo "Using directory: ${{ inputs.scan_source }}"
          fi

      - name: Install Veracode CLI in workspace
        run: |
          mkdir -p veracode-cli
          # Use absolute path for the -d flag
          VERACODE_CLI_DIR="$PWD/veracode-cli"
          echo "Installing to: $VERACODE_CLI_DIR"
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh -s -- -d "$VERACODE_CLI_DIR"
          
          # Debug: List what was installed
          echo "=== Veracode CLI directory structure ==="
          find veracode-cli -type f -o -type l 2>/dev/null || echo "No files found in veracode-cli"
          echo "=== End directory structure ==="
          
          # Check if veracode binary exists
          if [ -f "$VERACODE_CLI_DIR/veracode" ]; then
            echo "Found veracode binary at: $VERACODE_CLI_DIR/veracode"
            ls -la "$VERACODE_CLI_DIR/veracode"
          else
            echo "WARNING: veracode binary not found at expected location"
            find veracode-cli -name "veracode*" -type f 2>/dev/null
          fi

      - name: Run Veracode scan
        run: |
          VERACODE_CLI_DIR="$PWD/veracode-cli"
          "$VERACODE_CLI_DIR/veracode" scan \
            --source ${{ inputs.scan_source }} \
            --type ${{ inputs.scan_type }} \
            --format ${{ inputs.format_result }} \
            --output results.txt

      - name: Rename scan results to safe artifact names
        run: |
          for f in results.* sbom_*; do
            if [ -f "$f" ]; then
              # Reemplaza espacios o caracteres especiales
              safe_name=$(echo "$f" | tr '[:upper:] ' '[:lower:]_' | tr -cd '[:alnum:]_.')
              mv "$f" "veracode_iac_${safe_name}"
            fi
          done

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: veracode-iac-scan-results
          path: veracode_iac_*