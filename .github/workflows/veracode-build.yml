name: veracode-build

on:
  push:
    branches:
      - feature/*
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_path: ${{ steps.autopackage.outputs.artifact_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔐 Instalar CLI
      - name: Install Veracode CLI
        run: curl -fsS https://tools.veracode.com/veracode-cli/install | sh

      # 🔑 Credenciales
      - name: Set Veracode credentials
        run: |
          echo "VERACODE_API_KEY_ID=${{ secrets.VERACODE_API_ID }}" >> $GITHUB_ENV
          echo "VERACODE_API_KEY_SECRET=${{ secrets.VERACODE_API_KEY }}" >> $GITHUB_ENV

      # 🔥 Auto-Package + selección PRO
      - name: Veracode Auto-Package
        id: autopackage
        run: |
          set -e

          OUTPUT_DIR="veracode-output"
          mkdir -p $OUTPUT_DIR

          echo "🚀 Running Veracode Auto-Package..."
          ./veracode package \
            --source "." \
            --output "$OUTPUT_DIR" \
            --trust \
            --verbose

          echo "📦 Generated artifacts:"
          ls -lh $OUTPUT_DIR

          echo "🔍 Selecting best artifact..."

          # 1. Buscar nombres típicos
          artifact=$(find $OUTPUT_DIR -name "*.zip" | grep -E "app|api|web" | head -n 1)

          # 2. Fallback al más grande
          if [ -z "$artifact" ]; then
            echo "⚠️ No named artifact found, selecting largest..."
            artifact=$(ls -S $OUTPUT_DIR/*.zip | head -n 1)
          fi

          if [ -z "$artifact" ]; then
            echo "::error::No artifact found"
            exit 1
          fi

          echo "✅ Selected artifact: $artifact"
          echo "artifact_path=$artifact" >> $GITHUB_OUTPUT

      # 📤 Subir SOLO el artifact correcto
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifact
          path: ${{ steps.autopackage.outputs.artifact_path }}

  # 🐳 Docker (solo PR feature → develop)
  build-docker-image:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'feature/') &&
      github.event.pull_request.base.ref == 'develop'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/verademo-net:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

  # 🔐 Pipeline Scan (rápido)
  veracode-pipeline-scan:
    needs: build
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/veracode-pipeline-scan.yml
    secrets: inherit
    with:
      veracode_policy_name: 'Veracode Recommended Very High + SCA'
      json_output: true
      output_file: veracode-results.json
      fail_build: false
      verbose: true

  # 🧪 Sandbox feature
  veracode-sandbox-feature:
    needs: build
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/veracode-sand-box.yml
    secrets: inherit
    with:
      veracode_app_profile_name: 'verademo-net'
      veracode_sandbox_name: ${{ github.ref_name }}-sandbox
      create_profile: true
      create_sandbox: true
      scan_timeout: 0

  # 🏗️ IaC scan (repo)
  veracode-iac-scan:
    needs: build
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/veracode-iac-scan.yml
    secrets: inherit
    with:
      scan_type: directory
      scan_source: .
      format_result: table

  # 🐳 IaC scan imagen
  veracode-iac-scan_image:
    needs: build-docker-image
    if: |
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    uses: ./.github/workflows/veracode-iac-scan.yml
    secrets: inherit
    with:
      scan_type: image
      scan_source: ghcr.io/${{ github.repository }}/verademo-net:${{ github.sha }}
      format_result: table

  # 🔐 Policy Scan (solo PR hacia develop)
  veracode-policy-scan:
    needs: build
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop'
    uses: ./.github/workflows/veracode-policy-scan.yml
    secrets: inherit
    with:
      veracode_app_profile_name: 'verademo-net'