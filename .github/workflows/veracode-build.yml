name: veracode-build

on:
  push:
    branches:
      - feature/*
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Veracode CLI
        run: curl -fsS https://tools.veracode.com/veracode-cli/install | sh

      - name: Set Veracode credentials
        run: |
          echo "VERACODE_API_KEY_ID=${{ secrets.VERACODE_API_ID }}" >> $GITHUB_ENV
          echo "VERACODE_API_KEY_SECRET=${{ secrets.VERACODE_API_KEY }}" >> $GITHUB_ENV

      - name: Veracode Auto-Package
        run: |
          PROJECT_PATH="."
          OUTPUT_DIR="veracode-output"

          mkdir -p $OUTPUT_DIR

          ./veracode package \
            --source "$PROJECT_PATH" \
            --output "$OUTPUT_DIR" \
            --trust \
            --verbose

          echo "📦 Generated artifacts:"
          ls -lh $OUTPUT_DIR

      # 🔥 SELECCIÓN PRO DEL ARTIFACT
      - name: Select best Veracode artifact
        id: select_artifact
        run: |
          echo "🔍 Searching for best artifact..."

          # Intento 1: buscar por nombre típico (app/api/web)
          artifact=$(find veracode-output -name "*.zip" | grep -E "app|api|web" | head -n 1)

          # Intento 2: fallback al archivo más grande
          if [ -z "$artifact" ]; then
            echo "⚠️ No named artifact found, selecting largest..."
            artifact=$(ls -S veracode-output/*.zip | head -n 1)
          fi

          if [ -z "$artifact" ]; then
            echo "::error::No artifact found"
            exit 1
          fi

          echo "✅ Selected artifact: $artifact"
          echo "artifact_path=$artifact" >> $GITHUB_OUTPUT

      - name: Upload package for Veracode
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifact
          path: ${{ steps.select_artifact.outputs.artifact_path }}

  build-docker-image:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'feature/')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}/verademo-net:${{ github.sha }} .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}/verademo-net:${{ github.sha }}

  veracode-pipeline-scan:
    needs: build
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/veracode-pipeline-scan.yml
    secrets: inherit
    with:
      veracode_policy_name: 'Veracode Recommended Very High + SCA'
      json_output: true
      output_file: veracode-results.json
      fail_build: false
      verbose: true

  veracode-sandbox-feature:
    needs: build
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/veracode-sand-box.yml
    secrets: inherit
    with:
      veracode_app_profile_name: 'verademo-net'
      veracode_sandbox_name: 'feature-sandbox'
      create_profile: true
      create_sandbox: true
      scan_timeout: 0

  veracode-iac-scan:
    needs: build
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/veracode-iac-scan.yml
    secrets: inherit
    with:
      scan_type: directory
      scan_source: .
      format_result: table

  veracode-iac-scan_image:
    needs: build-docker-image
    if: |
      github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'feature/')
    uses: ./.github/workflows/veracode-iac-scan.yml
    secrets: inherit
    with:
      scan_type: image
      scan_source: ghcr.io/${{ github.repository }}/verademo-net:${{ github.sha }}
      format_result: table

  veracode-sandbox-develop:
    needs: build
    if: |
      github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'feature/')
    uses: ./.github/workflows/veracode-sand-box.yml
    secrets: inherit
    with:
      veracode_app_profile_name: 'verademo-net'
      veracode_sandbox_name: 'feature-develop-sandbox'
      create_profile: true
      create_sandbox: true

  veracode-policy-scan:
    needs: build
    if: |
      github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'
    uses: ./.github/workflows/veracode-policy-scan.yml
    secrets: inherit
    with:
      veracode_app_profile_name: 'verademo-net'